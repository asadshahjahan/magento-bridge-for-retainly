name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PHP 8.1 is the MINIMUM composer.json claims (`"php": ">=8.1"`), and linting on
# the minimum is what actually protects that claim: 8.2/8.3-only syntax fails
# here instead of at a merchant's `setup:di:compile`.
env:
  PHP_VERSION: "8.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
          coverage: none

      # Syntax check is repo-wide and blocking: it has no false positives, so
      # there is no backlog to grandfather.
      - name: php -l (repo-wide)
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { php -l "$f"; fail=1; }
          done < <(find src -type f \( -name '*.php' -o -name '*.phtml' \))
          exit $fail

      # Installed in an isolated directory ON PURPOSE. Running composer against
      # the repo's own composer.json would try to resolve magento/framework from
      # repo.magento.com, which needs auth keys CI does not have (and should not).
      - name: Install Magento coding standard
        run: |
          mkdir -p /tmp/phpcs
          cat > /tmp/phpcs/composer.json <<'JSON'
          {
            "require-dev": {"magento/magento-coding-standard": "*"},
            "config": {"allow-plugins": {"dealerdirect/phpcodesniffer-composer-installer": true}}
          }
          JSON
          composer install --working-dir=/tmp/phpcs --no-interaction --no-progress

      # Repo-wide and BLOCKING, on errors only. The other ZeroSlip repos lint
      # changed files only because they carry a large pre-existing backlog; this
      # module does not — the first CI run measured 0 errors across all 16 files
      # — so there is nothing to grandfather and the whole repo can be gated.
      #
      # --warning-severity=0 draws the line at errors. The 78 warnings are real
      # but advisory (see the next step); promoting them to blocking would fail
      # any PR that touches one of the 16 files for problems it did not
      # introduce, which is exactly the backlog trap this repo gets to skip.
      - name: phpcs Magento2 (repo-wide)
        run: /tmp/phpcs/vendor/bin/phpcs --standard=Magento2 --extensions=php,phtml --warning-severity=0 src/

      # Advisory: which sniffs the outstanding warnings come from, into the run
      # summary, so the count stays visible instead of silently growing. Drop
      # --warning-severity=0 from the step above once this reaches zero.
      - name: phpcs warnings (advisory)
        if: always()
        run: |
          {
            echo '## phpcs warnings (advisory, not blocking)'
            echo '```'
            /tmp/phpcs/vendor/bin/phpcs --standard=Magento2 --extensions=php,phtml \
              --report=source src/ 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer
          coverage: none

      # Not --strict, deliberately. --strict promotes warnings to errors, and
      # the only warning either file produces is the unbound `magento/framework
      # ">=100.4"` constraint — which is a packaging decision, not a defect:
      # capping it would make every new Magento minor release require a module
      # release just to stay installable. Plain validate still fails on real
      # schema errors, and prints that warning into the log so it stays visible.
      # (The module's own composer.json also keeps the `version` field Magento
      # Marketplace reads, which --strict rejects outright.)
      - name: composer validate
        run: |
          composer validate --no-check-lock
          composer validate --no-check-lock src/app/code/Retnly/MagentoBridge/composer.json

      - name: XML well-formedness
        run: |
          command -v xmllint > /dev/null || sudo apt-get install -y -qq libxml2-utils
          find src -name '*.xml' -print0 | xargs -0 -r xmllint --noout

      - name: JSON parse
        run: |
          find . -name '*.json' -not -path './vendor/*' -print0 \
            | xargs -0 -r -n1 python3 -m json.tool --sort-keys > /dev/null

      - name: JS syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -r -n1 node --check

      # The checks that only CI can make: nothing here installs Magento (that
      # needs repo.magento.com credentials), so a broken module identity would
      # otherwise first surface on a merchant's store.
      - name: Module identity
        run: python3 .github/scripts/check_module.py
